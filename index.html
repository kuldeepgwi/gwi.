<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GWI Dashboard</title>
    <style>
        body { background-color: #0d0d0d; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 10px; margin-bottom: 20px; border-left: 5px solid #d4af37; text-align: left; }
        .income-box { background: #1a1a1a; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #d4af37; font-weight: bold; }
        button { width: 100%; padding: 15px; background: #d4af37; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: black; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Welcome, <span id="userName">User</span>!</h2>
        <p>GWI में आपका स्वागत है।</p>
    </div>

    <div class="income-box">TODAY INCOME: ₹0.00</div>
    <div class="income-box">PASSIVE INCOME: ₹0.00</div>
    <div class="income-box">LEVEL UP BONUS: ₹0.00</div>
    <div class="income-box">TOTAL INCOME: ₹0.00</div>

    <button onclick="logout()">LOGOUT</button>

    <script>
        const sessionData = localStorage.getItem('gwiUser');
        if(!sessionData) {
            window.location.href = "login.html";
        } else {
            document.getElementById('userName').innerText = JSON.parse(sessionData).fullName;
        }
        
        function logout() { 
            localStorage.removeItem('gwiUser'); 
            window.location.href = "login.html"; 
        }
    </script>
</body>
</html>
