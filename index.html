<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GWI Secure Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}
body{
background:#070707;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.box{
width:95%;
max-width:420px;
background:#111;
padding:30px;
border-radius:20px;
box-shadow:0 0 30px rgba(255,215,0,.15);
}
h1{
color:#FFD700;
text-align:center;
margin-bottom:10px;
}
p{
color:#aaa;
text-align:center;
margin-bottom:25px;
}
input{
width:100%;
height:50px;
margin:10px 0;
border:none;
outline:none;
border-radius:12px;
padding:15px;
background:#1b1b1b;
color:#fff;
}
button{
width:100%;
height:52px;
background:#FFD700;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}
a{
display:block;
text-align:center;
margin-top:20px;
color:#FFD700;
text-decoration:none;
}
</style>

</head>
<body>

<div class="box">

<h1>GWI Login</h1>

<p>Login with your GWI ID</p>

<input type="text" placeholder="Enter GWI ID">

<input type="password" placeholder="Password">

<button>Secure Login</button>

<a href="register.html">
Create New GWI ID
</a>

</div>

</body>
</html>
