<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growth With India (GWI)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0b0b; color: #ffffff; overflow-x: hidden; }
        
        /* Modal Popup Styles */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); backdrop-filter: blur(8px); justify-content: center; align-items: center; }
        .modal-content { 
            background-color: #111; border: 1px solid #d4af37; padding: 30px; border-radius: 15px; 
            width: 90%; max-width: 450px; max-height: 85vh; overflow-y: auto; /* Scrollable added */
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.2); position: relative;
        }
        .close-btn { position: absolute; right: 20px; top: 15px; color: #aaa; font-size: 28px; cursor: pointer; }
        
        .form-group { margin-bottom: 15px; position: relative; }
        .form-group i { position: absolute; left: 15px; top: 14px; color: #d4af37; }
        .form-group input, .form-group select { 
            width: 100%; padding: 12px 12px 12px 45px; background: #1a1a1a; border: 1px solid #333; 
            color: #fff; border-radius: 8px; outline: none; font-size: 16px;
        }
        .btn-submit { width: 100%; padding: 12px; background: linear-gradient(45deg, #d4af37, #aa7c11); border: none; color: #000; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }

        /* Existing Styles (Keep as is) */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(11, 11, 11, 0.95); border-bottom: 1px solid #d4af37; position: fixed; width: 100%; top: 0; z-index: 1000; }
        .logo { font-size: 24px; font-weight: bold; color: #d4af37; }
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: radial-gradient(circle, #1a1a1a 0%, #0b0b0b 100%); }
        .btn-join { padding: 15px 40px; background: linear-gradient(45deg, #d4af37, #aa7c11); color: #000; font-weight: bold; border-radius: 50px; cursor: pointer; border: none; }
        .whatsapp-float { position: fixed; bottom: 30px; right: 30px; background-color: #25d366; color: #fff; width: 60px; height: 60px; border-radius: 50px; display: flex; align-items: center; justify-content: center; z-index: 100; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">GWI</div>
    </nav>

    <section class="hero">
        <h1>WELCOME TO GROWTH WITH INDIA</h1>
        <button class="btn-join" id="openFormBtn">Join Now</button>
    </section>

    <!-- Registration Modal -->
    <div id="regModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeFormBtn">&times;</span>
            <h2 style="color: #d4af37; text-align: center;">Register Now</h2>
            <form id="registrationForm">
                <div class="form-group">
                    <i class="fa-solid fa-id-badge"></i>
                    <input type="text" placeholder="Sponsor ID" required>
                </div>
                <div class="form-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" placeholder="Mobile Number" required>
                </div>
                <div class="form-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" placeholder="Email Address" required>
                </div>
                <div class="form-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Create Password" required>
                </div>
                <div class="form-group">
                    <i class="fa-solid fa-globe"></i>
                    <select required>
                        <option value="" disabled selected>Select Country</option>
                        <option value="India">India</option>
                    </select>
                </div>
                <div class="form-group">
                    <i class="fa-solid fa-location-dot"></i>
                    <select required>
                        <option value="" disabled selected>Select State</option>
                        <option value="Rajasthan">Rajasthan</option>
                        <option value="Delhi">Delhi</option>
                        <option value="UP">Uttar Pradesh</option>
                        <option value="Haryana">Haryana</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Complete Registration</button>
            </form>
        </div>
    </div>

    <a href="https://wa.me/919999999999" class="whatsapp-float" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>

    <script>
        const modal = document.getElementById("regModal");
        const openBtn = document.getElementById("openFormBtn");
        const closeBtn = document.getElementById("closeFormBtn");
        openBtn.onclick = () => modal.style.display = "flex";
        closeBtn.onclick = () => modal.style.display = "none";
        window.onclick = (event) => { if (event.target == modal) modal.style.display = "none"; }
    </script>
</body>
</html>
