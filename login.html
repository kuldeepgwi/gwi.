<!DOCTYPE html>
<html>
<head>
<title>GWI Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
}

.login-box{
    width:350px;
    padding:35px;
    background:#111;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 30px #d4af37;
}

.logo{
    font-size:45px;
    font-weight:bold;
    color:#d4af37;
}

.name{
    color:white;
    font-size:18px;
    margin-bottom:25px;
}

h2{
    color:white;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border-radius:10px;
    border:none;
    outline:none;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#d4af37;
    color:#000;
    font-size:18px;
    font-weight:bold;
}

p{
    color:white;
}

a{
    color:#d4af37;
    text-decoration:none;
}

</style>
</head>

<body>

<div class="login-box">

<div class="logo">GWI</div>
<div class="name">Growth With India</div>

<h2>Login</h2>

<input type="email" placeholder="Enter Email">

<input type="password" placeholder="Enter Password">

<button>LOGIN</button>

<p><a href="#">Forgot Password?</a></p>

<p>Don't have an account?</p>
<a href="register.html">Create Account</a>

</div>

</body>
</html>
