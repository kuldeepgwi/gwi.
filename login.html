<!DOCTYPE html>
<html>
<head>
<title>GWI Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#000,#222);
}

.login-box{
    width:90%;
    max-width:380px;
    padding:35px;
    background:#111;
    border-radius:20px;
    border:2px solid #d4af37;
    box-shadow:0 0 30px #d4af37;
}

.logo{
    text-align:center;
    font-size:45px;
    font-weight:bold;
    color:#d4af37;
}

.company{
    text-align:center;
    color:white;
    font-size:18px;
    margin-bottom:25px;
}

h2{
    text-align:center;
    color:white;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    background:#000;
    color:white;
    border:1px solid #d4af37;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    background:#d4af37;
    color:#000;
    border:none;
    border-radius:30px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ffd700;
}

p{
    text-align:center;
    color:white;
    margin-top:20px;
}

a{
    color:#d4af37;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">GWI</div>

<div class="company">
Growth With India
</div>

<h2>Login Account</h2>


<input type="text" placeholder="Enter GWI ID">

<input type="password" placeholder="Enter Password">


<button onclick="login()">
LOGIN
</button>


<p>
New User?
<a href="register.html">Register Now</a>
</p>


</div>


<script>

function login(){

window.location.href="dashboard.html";

}

</script>


</body>
</html>
