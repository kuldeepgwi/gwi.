<!DOCTYPE html>
<html>
<head>
<title>GWI Login</title>

<style>
body{
    margin:0;
    min-height:100vh;
    background:#000;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.login-box{
    width:90%;
    max-width:450px;
    padding:40px 30px;
    background:#111;
    border:2px solid gold;
    border-radius:20px;
    box-shadow:0 0 20px gold;
}

.logo{
    text-align:center;
    color:gold;
    font-size:35px;
    font-weight:bold;
    margin-bottom:10px;
}

h2{
    text-align:center;
    color:white;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:16px;
    margin:12px 0;
    background:#000;
    color:white;
    border:1px solid gold;
    border-radius:12px;
    font-size:17px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:16px;
    margin-top:20px;
    background:gold;
    color:black;
    border:none;
    border-radius:30px;
    font-size:20px;
    font-weight:bold;
}

button:hover{
    background:#ffd700;
}

p{
    text-align:center;
    margin-top:25px;
}

a{
    color:gold;
}
</style>

</head>

<body>

<div class="login-box">

<div class="logo">GWI</div>

<h2>LOGIN</h2>

<input type="text" placeholder="Enter GWI ID">

<input type="password" placeholder="Enter Password">

<button>LOGIN</button>

<p>New User? <a href="register.html">Register</a></p>

</div>

</body>
</html>
