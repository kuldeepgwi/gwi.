<!DOCTYPE html>
<html>
<head>
<title>GWI Login</title>

<style>
body{
    margin:0;
    background:#050505;
    font-family:Arial;
    color:white;
}

.login-box{
    width:90%;
    max-width:400px;
    margin:80px auto;
    padding:25px;
    background:#111;
    border:2px solid gold;
    border-radius:15px;
    box-shadow:0 0 15px gold;
}

h1{
    text-align:center;
    color:gold;
}

input{
    width:100%;
    padding:14px;
    margin:12px 0;
    background:#000;
    color:white;
    border:1px solid gold;
    border-radius:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    background:gold;
    color:black;
    border:none;
    border-radius:25px;
    font-size:18px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="login-box">

<h1>GWI LOGIN</h1>

<input type="text" placeholder="Enter GWI ID">

<input type="password" placeholder="Enter Password">

<button>LOGIN</button>

</div>

</body>
</html>
