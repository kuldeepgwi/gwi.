<!DOCTYPE html>
<html>
<head>

<title>GWI Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#000;
}

.box{
width:90%;
max-width:380px;
background:#111;
padding:30px;
border-radius:20px;
border:2px solid gold;
box-shadow:0 0 20px gold;
}

.logo{
text-align:center;
color:gold;
font-size:40px;
font-weight:bold;
}

h2{
text-align:center;
color:white;
}

input{
width:100%;
padding:13px;
margin:10px 0;
border-radius:10px;
border:none;
}

button{
width:100%;
padding:14px;
background:gold;
border:none;
border-radius:25px;
font-size:18px;
font-weight:bold;
}

p{
color:white;
text-align:center;
}

a{
color:gold;
}

</style>

</head>

<body>

<div class="box">

<div class="logo">GWI</div>

<h2>LOGIN</h2>


<input id="gwiid" placeholder="Enter GWI ID">

<input id="password" type="password" placeholder="Enter Password">


<button onclick="login()">LOGIN</button>


<p id="error"></p>


<p>
New User?
<a href="register.html">Register</a>
</p>


</div>


<script>

function login(){

let user=JSON.parse(localStorage.getItem("gwiUser"));

let id=document.getElementById("gwiid").value;
let pass=document.getElementById("password").value;


if(user && id==user.gwiid && pass==user.password){

localStorage.setItem("loginUser",JSON.stringify(user));

window.location.href="dashboard.html";

}

else{

document.getElementById("error").innerHTML="Wrong GWI ID or Password";

}

}

</script>


</body>
</html>
