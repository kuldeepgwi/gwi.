<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GWI - Professional Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }
        body {
            background: radial-gradient(circle at center, #1a1a1a 0%, #070707 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }
        .login-card {
            background: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 40px 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            text-align: center;
            position: relative;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 15%;
            width: 70%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #d4af37, #fbf5b7, #d4af37, transparent);
        }
        .brand-logo {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fbf5b7 0%, #d4af37 50%, #b38728 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 35px;
            letter-spacing: 1px;
        }
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }
        .input-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #d4af37;
            font-size: 1.1rem;
        }
        .input-group input {
            width: 100%;
            padding: 16px 16px 16px 50px;
            background: rgba(30, 30, 30, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            border-color: #d4af37;
            background: rgba(35, 35, 35, 0.8);
        }
        .forgot-pass {
            display: block;
            text-align: right;
            color: #888;
            font-size: 0.85rem;
            text-decoration: none;
            margin-top: -15px;
            margin-bottom: 30px;
        }
        .forgot-pass:hover { color: #d4af37; }
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #b38728 0%, #d4af37 50%, #fbf5b7 100%);
            border: none;
            border-radius: 12px;
            color: #000;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s ease;
            letter-spacing: 1px;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
        }
        .register-link {
            margin-top: 25px;
            color: #888;
            font-size: 0.9rem;
        }
        .register-link a {
            color: #d4af37;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-logo">GWI V2</div>
        <div class="subtitle">GROWTH WITH INDIA</div>
        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="loginEmail" placeholder="अपनी ईमेल आईडी भरें" required>
                <i class="fas fa-envelope"></i>
            </div>
            <div class="input-group">
                <input type="password" id="loginPassword" placeholder="पासवर्ड दर्ज करें" required>
                <i class="fas fa-lock"></i>
            </div>
            <a href="#" class="forgot-pass">Forgot Password?</a>
            <button type="submit" class="login-btn">SECURE LOGIN</button>
        </form>
        <div class="register-link">
            अकाउंट नहीं है? <a href="index.html">यहाँ रजिस्ट्रेशन करें</a>
        </div>
    </div>
</body>
</html>
