<!DOCTYPE html>
<html>
<head>

<title>GWI Premium Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="header">

<h1>✨ WELCOME TO ✨</h1>
<h2>🚀 GROWTH WITH INDIA FAMILY 🚀</h2>

</div>


<div class="container">


<div class="profile">

<img id="photo" src="https://via.placeholder.com/100">

<h2 id="name">User Name</h2>

<p>🆔 GWI ID: <span id="id">0</span></p>

<p>🏆 Rank: <span id="rank">0</span></p>

<p>🔰 Status: <span id="status">Inactive</span></p>

<button onclick="activateID()">✅ ID Activate</button>

</div>



<div class="card">
<h3>💰 Today Income</h3>
<h2>₹<span id="today">0</span></h2>
</div>


<div class="card">
<h3>📊 Last 7 Days Income</h3>
<h2>₹<span id="week">0</span></h2>
</div>


<div class="card">
<h3>👥 N/W Income</h3>
<h2>₹<span id="nw">0</span></h2>
</div>


<div class="card">
<h3>🎁 Level Up Bonus</h3>
<h2>₹<span id="bonus">0</span></h2>
</div>


<div class="card">
<h3>💎 Total Income</h3>
<h2>₹<span id="total">0</span></h2>
</div>



<div class="menu">

<button>👥 My Team</button>

<button>📝 Register</button>

<button>💳 Withdrawal</button>

<button>⚙️ Settings</button>

</div>


</div>


<script src="script.js"></script>

</body>
</html>
