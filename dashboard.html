<!DOCTYPE html>
<html>
<head>

<title>GWI Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

*{
box-sizing:border-box;
font-family:Arial;
}

body{
margin:0;
background:linear-gradient(135deg,#141e30,#243b55);
color:white;
}


.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
background:#111;
}


.logo{
font-size:32px;
font-weight:bold;
color:#00ffff;
}


button{
background:none;
border:0;
font-size:32px;
color:white;
}


.dropdown{
display:none;
position:absolute;
right:15px;
top:65px;
background:#222;
border-radius:15px;
overflow:hidden;
width:220px;
}


.dropdown p{
padding:12px;
margin:0;
border-bottom:1px solid #555;
}


.container{
padding:15px;
}


.card{
padding:20px;
border-radius:20px;
margin-bottom:15px;
box-shadow:0 5px 20px #0008;
font-size:18px;
}


.profile{
background:linear-gradient(135deg,#667eea,#764ba2);
text-align:center;
}


.income{
background:linear-gradient(135deg,#11998e,#38ef7d);
}


.week{
background:linear-gradient(135deg,#fc4a1a,#f7b733);
}


.team{
background:linear-gradient(135deg,#4776e6,#8e54e9);
}


.bonus{
background:linear-gradient(135deg,#ff512f,#dd2476);
}


.total{
background:linear-gradient(135deg,#f7971e,#ffd200);
color:black;
}


.money{
font-size:30px;
font-weight:bold;
margin-top:10px;
}


</style>

</head>


<body>


<div class="header">

<div class="logo">GWI 🚀</div>


<div>

<button onclick="openMenu()">⋮</button>


<div class="dropdown" id="menu">

<p>👤 Profile</p>
<p>💰 Income Details</p>
<p>👥 My Team</p>
<p>🏆 12 Levels</p>
<p>🎁 Level Bonus</p>
<p>💳 Withdrawal</p>
<p>⚙️ Settings</p>
<p onclick="logout()">🚪 Logout</p>

</div>

</div>

</div>



<div class="container">


<div class="card profile">

<h2>👤 User Name</h2>
<p>🆔 GWI ID</p>

</div>



<div class="card income">

<h3>💰 Today Income</h3>
<div class="money">₹0</div>

</div>



<div class="card week">

<h3>📊 Last 7 Days Income</h3>
<div class="money">₹0</div>

</div>



<div class="card team">

<h3>👥 N/W Income</h3>
<div class="money">₹0</div>

</div>



<div class="card bonus">

<h3>🏆 Level Up Bonus</h3>
<div class="money">₹0</div>

</div>



<div class="card total">

<h3>💎 Total Income</h3>
<div class="money">₹0</div>

</div>



</div>



<script>

function openMenu(){

let x=document.getElementById("menu");

x.style.display=x.style.display=="block"?"none":"block";

}


function logout(){

localStorage.removeItem("loginUser");
location.href="login.html";

}

</script>


</body>
</html>
