<!DOCTYPE html>

    padding:20px;
    text-align:center;
    border-bottom:2px solid gold;
}

.header h1{

}

.card{
    margin:15px;
    padding:20px;
    background:#111;
    border:1px solid gold;

    color:gold;

.amount{
    font-size:28px;
    margin-top:10px;
}

.profile{
    display:flex;
    justify-content:space-between;
}

button{
    width:90%;
    margin:10px 5%;
    padding:15px;
    border:none;
    border-radius:25px;
    background:gold;
    color:black;
    font-size:18px;
    font-weight:bold;
}

</style>
</head>

<body>

</div>

<div class="card">

</html>
