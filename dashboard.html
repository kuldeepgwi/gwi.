<!DOCTYPE html>
<html>
<head>

<title>GWI Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Arial;
background:#000;
color:white;
}

.header{
background:#111;
padding:20px;
text-align:center;
border-bottom:2px solid gold;
}

.header h1{
color:gold;
}


.profile{
margin:15px;
background:#111;
padding:20px;
border-radius:20px;
border:1px solid gold;
text-align:center;
}


.profile img{
width:90px;
height:90px;
border-radius:50%;
border:3px solid gold;
}


.card{
margin:15px;
background:#111;
padding:15px;
border-radius:20px;
border:1px solid gold;
}


.income{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}


.box{
background:#222;
padding:15px;
border-radius:15px;
text-align:center;
}


.box h3{
color:gold;
}


button{

width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:25px;
background:gold;
font-size:17px;
font-weight:bold;

}

</style>

</head>


<body>


<div class="header">
<h1>GWI DASHBOARD</h1>
</div>



<div class="profile">

<img src="profile.png">

<h2 id="name">User Name</h2>

<p>GWI ID : <span id="gwiid"></span></p>

<p style="color:lime;">● Active</p>

<p id="date"></p>

</div>




<div class="card">

<h2>Income Dashboard</h2>


<div class="income">


<div class="box">
<h3>Today Income</h3>
<p>₹0</p>
</div>


<div class="box">
<h3>NW Income</h3>
<p>₹0</p>
</div>


<div class="box">
<h3>Last 7 Days</h3>
<p>₹0</p>
</div>


<div class="box">
<h3>Level Up Bonus</h3>
<p>₹0</p>
</div>


<div class="box">
<h3>Total Income</h3>
<p>₹0</p>
</div>


</div>

</div>




<div class="card">

<h2>Quick Menu</h2>

<button>My Team</button>

<button>Withdraw</button>

<button>Income History</button>

<button>Settings</button>


</div>



<script>


let user = JSON.parse(localStorage.getItem("loginUser"));


if(user){

document.getElementById("name").innerHTML=user.name;

document.getElementById("gwiid").innerHTML=user.gwiid;

}


document.getElementById("date").innerHTML =
"Join Date : "+new Date().toLocaleString();


</script>


</body>
</html>
