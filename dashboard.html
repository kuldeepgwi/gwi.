<!DOCTYPE html>
<html>
<head>
<title>GWI Professional Dashboard</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#000;
    color:white;
}

.header{
    text-align:center;
    padding:20px;
    background:#111;
    border-bottom:2px solid gold;
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:gold;
}

.header p{
    color:#ddd;
}

.profile{
    margin:15px;
    padding:20px;
    background:#111;
    border:1px solid gold;
    border-radius:15px;
}

.info{
    display:flex;
    justify-content:space-between;
}

.title{
    color:gold;
    font-size:16px;
}

.card{
    margin:15px;
    padding:20px;
    background:#111;
    border-radius:15px;
    border:1px solid gold;
    box-shadow:0 0 8px #444;
}

.amount{
    font-size:30px;
    margin:5px 0;
}

.level{
    color:gold;
    font-size:22px;
}

button{
    width:90%;
    margin:10px 5%;
    padding:15px;
    border:none;
    border-radius:30px;
    background:gold;
    color:black;
    font-size:18px;
    font-weight:bold;
}

.footer{
    text-align:center;
    padding:20px;
    color:#aaa;
}

</style>

</head>

<body>

<div class="header">
<div class="logo">GWI</div>
<h2>INCOME DASHBOARD</h2>
<p>Growth With India</p>
</div>


<div class="profile">

<div class="info">
<div>
<p class="title">Name</p>
<h3>Kuldeep Singh</h3>
</div>

<div>
<p class="title">GWI ID</p>
<h3>GWI001</h3>
</div>
</div>

<p class="title">Sponsor ID</p>
<h3>GWI000</h3>

</div>



<div class="card">
<p class="title">TODAY INCOME</p>
<h2 class="amount">₹0</h2>
</div>


<div class="card">
<p class="title">N/W INCOME</p>
<h2 class="amount">₹0</h2>
</div>


<div class="card">
<p class="title">LEVEL UP BONUS</p>
<h2 class="amount">₹0</h2>
</div>


<div class="card">
<p class="title">LAST 7 DAY'S INCOME</p>

</div>


<div class="card">

<div class="card">

<button>MY TEAM</button>

<div class="footer">
© 2026 Growth With India
</div>

</html>
