<!DOCTYPE html>
<html>
<head>
<title>GWI Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
margin:0;
background:#000;
color:white;
font-family:Arial;
}

.header{
display:flex;
justify-content:space-between;
padding:15px;
background:#111;
border-bottom:2px solid gold;
}

.logo{
color:gold;
font-size:30px;
font-weight:bold;
}

button{
background:none;
border:0;
color:gold;
font-size:30px;
}

.menu{
display:none;
position:absolute;
right:10px;
top:60px;
background:#111;
border:1px solid gold;
border-radius:10px;
}

.menu p{
padding:10px 20px;
margin:0;
border-bottom:1px solid #333;
}


.container{
padding:15px;
}

.box{
background:#111;
border:1px solid gold;
border-radius:15px;
padding:15px;
margin-bottom:15px;
text-align:center;
}

.gold{
color:gold;
}

.money{
font-size:25px;
font-weight:bold;
}

</style>

</head>

<body>


<div class="header">

<div class="logo">GWI</div>

<div>
<button onclick="show()">⋮</button>

<div class="menu" id="menu">
<p onclick="alert('Profile')">Profile</p>
<p onclick="alert('Income')">Income Details</p>
<p onclick="alert('Team')">My Team</p>
<p onclick="alert('Levels')">Levels</p>
<p onclick="logout()">Logout</p>
</div>

</div>

</div>



<div class="container">

<div class="box">
<h2 class="gold" id="name">User Name</h2>
<p id="id">GWI ID</p>
</div>


<div class="box">
<h3 class="gold">Today Income</h3>
<div class="money">₹0</div>
</div>


<div class="box">
<h3 class="gold">Last 7 Days Income</h3>
<div class="money">₹0</div>
</div>


<div class="box">
<h3 class="gold">Total Income</h3>
<div class="money">₹0</div>
</div>


</div>



<script>

function show(){

let m=document.getElementById("menu");

m.style.display =
m.style.display=="block" ? "none" : "block";

}


let user=JSON.parse(localStorage.getItem("loginUser"));

if(user){

document.getElementById("name").innerHTML=user.name;

document.getElementById("id").innerHTML=user.gwiid;

}


function logout(){

localStorage.removeItem("loginUser");
location.href="login.html";

}

</script>


</body>
</html>
