<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GWI Income Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .welcome-box {
            background: linear-gradient(135deg, #161616, #0b0b0b);
            border-left: 5px solid #d4af37;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        .welcome-box h2 {
            margin: 0;
            color: #d4af37;
        }
        .income-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: linear-gradient(135deg, #1c1c1c, #111111);
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            transition: transform 0.3s ease, border-color 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #d4af37;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #b38728, #fbf5b7, #b38728);
        }
        .card-icon {
            font-size: 2.3rem;
            color: #d4af37;
            margin-bottom: 12px;
        }
        .card-title {
            font-size: 1rem;
            color: #aaaaaa;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .card-amount {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
        }
        .currency {
            color: #d4af37;
            margin-right: 4px;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="welcome-box">
            <h2>GWI डैशबोर्ड में आपका स्वागत है, <span id="userName">यूजर</span>!</h2>
            <p>आपकी लाइव इनकम और बिज़नेस रिपोर्ट नीचे दी गई है।</p>
        </div>
        <div class="income-grid">
            <div class="card">
                <div class="card-icon"><i class="fas fa-calendar-day"></i></div>
                <div class="card-title">Today Income</div>
                <div class="card-amount"><span class="currency">₹</span><span id="todayIncome">0.00</span></div>
            </div>
            <div class="card">
                <div class="card-icon"><i class="fas fa-chart-line"></i></div>
                <div class="card-title">Passive Income</div>
                <div class="card-amount"><span class="currency">₹</span><span id="passiveIncome">0.00</span></div>
            </div>
            <div class="card">
                <div class="card-icon"><i class="fas fa-trophy"></i></div>
                <div class="card-title">Level Up Bonus</div>
                <div class="card-amount"><span class="currency">₹</span><span id="levelUpBonus">0.00</span></div>
            </div>
            <div class="card">
                <div class="card-icon"><i class="fas fa-wallet"></i></div>
                <div class="card-title">Total Income</div>
                <div class="card-amount"><span class="currency">₹</span><span id="totalIncome">0.00</span></div>
            </div>
        </div>
    </div>
</body>
</html>
