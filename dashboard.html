<!DOCTYPE html>
<html>
<head>

<title>GWI Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#000;
    color:white;
}

.header{
    text-align:center;
    padding:25px;
    background:#111;
    border-bottom:2px solid gold;
}

.logo{
    color:gold;
    font-size:40px;
    font-weight:bold;
}

.company{
    font-size:18px;
}


.container{
    padding:20px;
}


.card{
    background:#111;
    border:1px solid gold;
    border-radius:15px;
    padding:20px;
    margin:15px 0;
    box-shadow:0 0 15px #d4af37;
}


.card h3{
    color:gold;
    margin:0 0 10px;
}


.amount{
    font-size:30px;
    font-weight:bold;
}


.profile{
    text-align:center;
}


button{
    width:100%;
    padding:15px;
    background:gold;
    border:none;
    border-radius:25px;
    font-size:18px;
    font-weight:bold;
    margin-top:20px;
}


</style>

</head>


<body>


<div class="header">

<div class="logo">GWI</div>

<div class="company">
Growth With India
</div>

</div>



<div class="container">


<div class="card profile">

<h3>Profile</h3>

<p>Name: User Name</p>

<p>GWI ID: GWI0001</p>

</div>



<div class="card">

<h3>Today Income</h3>

<div class="amount">
₹0
</div>

</div>



<div class="card">

<h3>Total Income</h3>

<div class="amount">
₹0
</div>

</div>



<div class="card">

<h3>Level Up Bonus</h3>

<div class="amount">
₹0
</div>

</div>



<div class="card">

<h3>Last 7 Days Income</h3>

<p>
Day 1: ₹0
</p>

<p>
Day 2: ₹0
</p>

<p>
Day 3: ₹0
</p>

</div>



<div class="card">

<h3>Team Details</h3>

<p>
Total Team: 0
</p>

<p>
Active Members: 0
</p>

</div>



<button onclick="logout()">
Logout
</button>


</div>



<script>

function logout(){

window.location.href="login.html";

}

</script>


</body>

</html>
