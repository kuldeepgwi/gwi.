<!DOCTYPE html>
<html>
<head>

<title>GWI Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
box-sizing:border-box;
font-family:Arial;
}

body{
margin:0;
background:#000;
color:white;
}


.header{
height:70px;
background:#111;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
border-bottom:2px solid gold;
}


.logo{
font-size:32px;
color:gold;
font-weight:bold;
}


.menu button{
background:none;
border:none;
color:gold;
font-size:35px;
}


.dropdown{

display:none;
position:absolute;
right:10px;
top:60px;
background:#111;
width:230px;
border:1px solid gold;
border-radius:15px;
}


.dropdown p{

padding:14px;
margin:0;
border-bottom:1px solid #333;
cursor:pointer;

}


.container{
padding:20px;
}


.profile{

background:#111;
border:1px solid gold;
border-radius:20px;
padding:20px;
text-align:center;

}


.profile img{

width:120px;
height:120px;
border-radius:50%;
border:3px solid gold;

}


.name{

color:gold;
font-size:24px;

}


.card{

background:#111;
border:1px solid gold;
border-radius:15px;
padding:15px;
margin-top:15px;

}


.card h3{

color:gold;

}


.amount{

font-size:28px;

}


</style>

</head>

<body>


<div class="header">

<div class="logo">
GWI
</div>


<div class="menu">

<button onclick="openMenu()">⋮</button>


<div class="dropdown" id="menu">


<p onclick="profile()">Profile</p>

<p onclick="income()">Income Details</p>

<p onclick="team()">My Team</p>

<p onclick="levels()">Levels</p>

<p onclick="bonus()">Level Bonus</p>

<p onclick="withdraw()">Withdrawal Request</p>

<p onclick="history()">Withdrawal History</p>

<p onclick="settings()">Settings</p>

<p onclick="logout()">Logout</p>


</div>

</div>

</div>
</div>
</body>
</html>
