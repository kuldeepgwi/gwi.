<!DOCTYPE html>
<html>
<head>
<title>GWI Premium Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#000;
color:white;
}

.header{
padding:22px 15px;
text-align:center;
background:linear-gradient(180deg,#111,#000);
border-bottom:2px solid gold;
}

.header h1{
margin:0;
font-size:24px;
color:#ffd700;
text-shadow:0 0 15px gold;
}

.header h2{
margin:8px 0 0;
font-size:18px;
letter-spacing:1px;
}


.menu{
position:absolute;
right:15px;
top:20px;
}

.menu button{
background:none;
border:0;
font-size:35px;
color:gold;
}


.dropdown{
display:none;
position:absolute;
right:0;
width:220px;
background:#111;
border:1px solid gold;
border-radius:15px;
overflow:hidden;
z-index:99;
}

.dropdown p{
margin:0;
padding:13px;
border-bottom:1px solid #333;
}


.container{
padding:15px;
}


.card{
background:#111;
border:1px solid gold;
border-radius:22px;
padding:18px;
margin-bottom:15px;
box-shadow:0 0 15px #8b6500;
}


.profile{
text-align:center;
}


.profile img{
width:110px;
height:110px;
border-radius:50%;
border:3px solid gold;
object-fit:cover;
}


.name{
color:gold;
font-size:24px;
}


.icon{
font-size:35px;
}


.title{
font-size:19px;
color:gold;
font-weight:bold;
}


.amount{
font-size:30px;
font-weight:bold;
margin-top:8px;
}


</style>
</head>


<body>


<div class="header">

<h1>✨ WELCOME TO ✨</h1>
<h2>🚀 GROWTH WITH INDIA FAMILY 🚀</h2>


<div class="menu">

<button onclick="openMenu()">⋮</button>

<div class="dropdown" id="menu">

<p>👤 Profile</p>
<p>💰 Income Details</p>
<p>👥 My Team</p>
<p>🏆 Levels</p>
<p>🎁 Level Bonus</p>
<p>💳 Withdrawal</p>
<p>⚙️ Settings</p>
<p onclick="logout()">🚪 Logout</p>

</div>

</div>

</div>



<div class="container">


<div class="card profile">

<img id="photo">

<h2 class="name" id="name">
User Name
</h2>

<p id="id">GWI ID</p>

</div>


<div class="card">
<div class="icon">💰</div>
<div class="title">Today Income</div>
<div class="amount">₹0</div>
</div>


<div class="card">
<div class="icon">📊</div>
<div class="title">Last 7 Days Income</div>
<div class="amount">₹0</div>
</div>


<div class="card">
<div class="icon">👥</div>
<div class="title">N/W Income</div>
<div class="amount">₹0</div>
</div>


<div class="card">
<div class="icon">🏆</div>
<div class="title">Level Up Bonus</div>
<div class="amount">₹0</div>
</div>


<div class="card">
<div class="icon">💎</div>
<div class="title">Total Income</div>
<div class="amount">₹0</div>
</div>


</div>



<script>

function openMenu(){

let m=document.getElementById("menu");

m.style.display=m.style.display=="block"?"none":"block";

}


let user=JSON.parse(localStorage.getItem("loginUser"));


if(user){

document.getElementById("name").innerHTML=user.name || "User";

document.getElementById("id").innerHTML=user.gwiid || "GWI ID";


if(user.photo){

document.getElementById("photo").src=user.photo;

}

}


function logout(){

localStorage.removeItem("loginUser");
location.href="login.html";

}

</script>


</body>
</html>
