<!DOCTYPE html>
<html>
<head>
<title>GWI Premium Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#050505;
color:white;
}

.header{
text-align:center;
padding:20px;
background:linear-gradient(135deg,#000,#241000);
border-bottom:2px solid gold;
}

.header h1{
margin:0;
font-size:25px;
color:#ffd700;
text-shadow:0 0 10px gold;
}

.header p{
margin:5px;
font-size:16px;
}


.menu{
position:absolute;
right:15px;
top:20px;
}

.menu button{
background:none;
border:0;
font-size:35px;
color:gold;
}


.dropdown{
display:none;
position:absolute;
right:0;
background:#111;
width:220px;
border:1px solid gold;
border-radius:15px;
overflow:hidden;
}

.dropdown p{
padding:12px;
margin:0;
border-bottom:1px solid #333;
}


.container{
padding:15px;
}


.card{
border-radius:20px;
padding:20px;
margin-bottom:15px;
box-shadow:0 0 15px #000;
}


.profile{
background:linear-gradient(135deg,#6a11cb,#2575fc);
text-align:center;
}


.income{
background:linear-gradient(135deg,#11998e,#38ef7d);
}


.week{
background:linear-gradient(135deg,#ff8008,#ffc837);
}


.team{
background:linear-gradient(135deg,#4776e6,#8e54e9);
}


.bonus{
background:linear-gradient(135deg,#ff416c,#ff4b2b);
}


.total{
background:linear-gradient(135deg,#f7971e,#ffd200);
color:black;
}


.money{
font-size:30px;
font-weight:bold;
}

</style>

</head>

<body>


<div class="header">

<h1>✨ WELCOME TO ✨</h1>
<p>🚀 GROWTH WITH INDIA FAMILY 🚀</p>


<div class="menu">

<button onclick="openMenu()">⋮</button>

<div class="dropdown" id="menu">

<p>👤 Profile</p>
<p>💰 Income Details</p>
<p>👥 My Team</p>
<p>🏆 Levels</p>
<p>🎁 Level Bonus</p>
<p>💳 Withdrawal</p>
<p>⚙️ Settings</p>
<p onclick="logout()">🚪 Logout</p>

</div>

</div>

</div>



<div class="container">


<div class="card profile">
<h2>👤 User Name</h2>
<p>🆔 GWI ID</p>
</div>


<div class="card income">
<h3>💰 Today Income</h3>
<div class="money">₹0</div>
</div>


<div class="card week">
<h3>📊 Last 7 Days Income</h3>
<div class="money">₹0</div>
</div>


<div class="card team">
<h3>👥 N/W Income</h3>
<div class="money">₹0</div>
</div>


<div class="card bonus">
<h3>🏆 Level Up Bonus</h3>
<div class="money">₹0</div>
</div>


<div class="card total">
<h3>💎 Total Income</h3>
<div class="money">₹0</div>
</div>


</div>



<script>

function openMenu(){

let x=document.getElementById("menu");

x.style.display=x.style.display=="block"?"none":"block";

}


function logout(){

localStorage.removeItem("loginUser");
location.href="login.html";

}

</script>


</body>
</html>
