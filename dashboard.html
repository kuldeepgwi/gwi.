<!DOCTYPE html>
<html>
<head>

<title>GWI Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#000;
color:white;
}

.header{
text-align:center;
padding:25px;
background:#111;
border-bottom:2px solid gold;
}

.logo{
font-size:42px;
font-weight:bold;
color:gold;
}

.company{
font-size:18px;
}


.container{
padding:20px;
}


.card{
background:#111;
border:1px solid gold;
border-radius:15px;
padding:20px;
margin:15px 0;
box-shadow:0 0 15px #d4af37;
}


.card h3{
color:gold;
margin-top:0;
}


.value{
font-size:28px;
font-weight:bold;
}


button{
width:100%;
padding:15px;
margin-top:20px;
background:gold;
border:none;
border-radius:25px;
font-size:18px;
font-weight:bold;
}


</style>

</head>


<body>


<div class="header">

<div class="logo">GWI</div>

<div class="company">
Growth With India
</div>

</div>



<div class="container">


<div class="card">

<h3>Profile</h3>

<p>Name: <span id="username">User</span></p>

<p>GWI ID: <span id="gwiid">GWI0000</span></p>

</div>



<div class="card">

<h3>Today Income</h3>

<div class="value">₹0</div>

</div>



<div class="card">

<h3>Last 7 Days Income</h3>

<div class="value">₹0</div>

</div>



<div class="card">

<h3>N/W Income</h3>

<div class="value">₹0</div>

</div>



<div class="card">

<h3>Level Up Bonus</h3>

<div class="value">₹0</div>

</div>



<div class="card">

<h3>Total Income</h3>

<div class="value">₹0</div>

</div>



<div class="card">

<h3>Team Details</h3>

<p>Total Team: 0</p>

<p>Active Members: 0</p>

</div>



<button onclick="logout()">
Logout
</button>


</div>



<script>

let user=JSON.parse(localStorage.getItem("loginUser"));


if(user){

document.getElementById("username").innerHTML=user.name;

document.getElementById("gwiid").innerHTML=user.gwiid;

}


function logout(){

localStorage.removeItem("loginUser");

window.location.href="login.html";

}


</script>


</body>

</html>
