<!DOCTYPE html>
<html>
<head>

<title>GWI Premium Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

*{
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
margin:0;
background:linear-gradient(135deg,#090979,#020024,#00d4ff);
color:white;
}


/* Top */

.header{
text-align:center;
padding:25px 15px;
background:rgba(0,0,0,.5);
border-bottom:2px solid gold;
}


.header h1{
margin:0;
font-size:24px;
font-weight:800;
color:#ffd700;
text-shadow:0 0 15px gold;
}


.header h2{
margin:5px;
font-size:22px;
font-weight:800;
background:linear-gradient(90deg,#ffd700,#ff00ff,#00ffff);
-webkit-background-clip:text;
color:transparent;
}


.menu{
position:absolute;
right:15px;
top:20px;
}


.menu button{
font-size:35px;
color:white;
background:none;
border:0;
}


.dropdown{
display:none;
position:absolute;
right:0;
top:45px;
width:230px;
background:#111;
border-radius:15px;
overflow:hidden;
border:1px solid gold;
}


.dropdown p{
padding:13px;
margin:0;
border-bottom:1px solid #333;
}



.container{
padding:15px;
}



.card{
padding:20px;
border-radius:25px;
margin-bottom:15px;
box-shadow:0 0 20px #0008;
font-weight:600;
}


.profile{
background:linear-gradient(135deg,#ff512f,#dd2476);
text-align:center;
}


.income{
background:linear-gradient(135deg,#00b09b,#96c93d);
}


.week{
background:linear-gradient(135deg,#f7971e,#ffd200);
color:black;
}


.team{
background:linear-gradient(135deg,#4776e6,#8e54e9);
}


.bonus{
background:linear-gradient(135deg,#8e2de2,#4a00e0);
}


.total{
background:linear-gradient(135deg,#f12711,#f5af19);
}


.icon{
font-size:35px;
}


.money{
font-size:32px;
font-weight:800;
margin-top:8px;
}


</style>

</head>

<body>


<div class="header">

<h1>✨ WELCOME TO ✨</h1>
<h2>🚀 GROWTH WITH INDIA FAMILY 🚀</h2>


<div class="menu">

<button onclick="openMenu()">⋮</button>

<div class="dropdown" id="menu">

<p>👤 Profile</p>
<p>💰 Income Details</p>
<p>👥 My Team</p>
<p>🏆 12 Levels</p>
<p>🎁 Level Bonus</p>
<p>💳 Withdrawal</p>
<p>⚙️ Settings</p>

</div>

</div>

</div>



<div class="container">


<div class="card profile">
<div class="icon">👤</div>
<h2>User Name</h2>
<p>🆔 GWI ID</p>
</div>



<div class="card income">
<div class="icon">💰</div>
Today Income
<div class="money">₹0</div>
</div>



<div class="card week">
<div class="icon">📊</div>
Last 7 Days Income
<div class="money">₹0</div>
</div>



<div class="card team">
<div class="icon">👥</div>
N/W Income
<div class="money">₹0</div>
</div>



<div class="card bonus">
<div class="icon">🏆</div>
Level Up Bonus
<div class="money">₹0</div>
</div>



<div class="card total">
<div class="icon">💎</div>
Total Income
<div class="money">₹0</div>
</div>


</div>



<script>

function openMenu(){

let x=document.getElementById("menu");

x.style.display=x.style.display=="block"?"none":"block";

}

</script>


</body>
</html>
