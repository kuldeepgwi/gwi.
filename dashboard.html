<!DOCTYPE html>
<html>
<head>
<title>GWI Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{
box-sizing:border-box;
font-family:Arial;
}

body{
margin:0;
min-height:100vh;
background:linear-gradient(135deg,#6a11cb,#2575fc,#00c6ff);
color:white;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
background:rgba(0,0,0,.4);
}

.logo{
font-size:32px;
font-weight:bold;
}

.menu button{
font-size:32px;
background:none;
border:0;
color:white;
}

.dropdown{
display:none;
position:absolute;
right:15px;
top:65px;
background:#111;
border-radius:15px;
overflow:hidden;
width:220px;
}

.dropdown p{
margin:0;
padding:12px;
border-bottom:1px solid #444;
}

.container{
padding:15px;
}

.card{
background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);
border-radius:20px;
padding:20px;
margin-bottom:15px;
box-shadow:0 5px 20px #0005;
}

.profile{
text-align:center;
}

.profile img{
width:100px;
height:100px;
border-radius:50%;
border:3px solid white;
}

.title{
font-size:22px;
font-weight:bold;
}

.money{
font-size:30px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="header">

<div class="logo">GWI</div>

<div class="menu">
<button onclick="menu()">⋮</button>

<div class="dropdown" id="drop">
<p>Profile</p>
<p>Income Details</p>
<p>My Team</p>
<p>12 Levels</p>
<p>Level Bonus</p>
<p>Withdrawal</p>
<p>Settings</p>
<p onclick="logout()">Logout</p>
</div>

</div>

</div>


<div class="container">


<div class="card profile">
<img src="">
<div class="title" id="name">User Name</div>
<p id="id">GWI ID</p>
</div>


<div class="card">
Today Income
<div class="money">₹0</div>
</div>


<div class="card">
Last 7 Days Income
<div class="money">₹0</div>
</div>


<div class="card">
N/W Income
<div class="money">₹0</div>
</div>


<div class="card">
Level Up Bonus
<div class="money">₹0</div>
</div>


<div class="card">
Total Income
<div class="money">₹0</div>
</div>


</div>


<script>

function menu(){

let x=document.getElementById("drop");

x.style.display=x.style.display=="block"?"none":"block";

}


let user=JSON.parse(localStorage.getItem("loginUser"));

if(user){

document.getElementById("name").innerHTML=user.name||"User";

document.getElementById("id").innerHTML=user.gwiid||"GWI ID";

}


function logout(){

localStorage.removeItem("loginUser");

location.href="login.html";

}

</script>

</body>
</html>
