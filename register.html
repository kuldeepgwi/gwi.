<!DOCTYPE html>
<html>
<head>
<title>GWI Registration</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#000;
}

.box{
width:90%;
max-width:380px;
background:#111;
padding:30px;
border-radius:20px;
border:2px solid gold;
box-shadow:0 0 20px gold;
}

.logo{
text-align:center;
color:gold;
font-size:40px;
font-weight:bold;
}

h2{
color:white;
text-align:center;
}

input,select{
width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:none;
}

button{
width:100%;
padding:14px;
background:gold;
border:none;
border-radius:25px;
font-weight:bold;
font-size:18px;
}

p{
color:white;
text-align:center;
}

a{
color:gold;
}
</style>

</head>

<body>

<div class="box">

<div class="logo">GWI</div>

<h2>Register</h2>

<input id="name" placeholder="Full Name">

<input id="mobile" placeholder="Mobile Number">

<input id="email" placeholder="Email ID">

<input id="password" type="password" placeholder="Create Password">


<button onclick="register()">REGISTER</button>


<p id="result"></p>

<p>
Already Member?
<a href="login.html">Login</a>
</p>

</div>


<script>

function register(){

let id="GWI"+Math.floor(10000+Math.random()*90000);

let user={
name:document.getElementById("name").value,
mobile:document.getElementById("mobile").value,
email:document.getElementById("email").value,
password:document.getElementById("password").value,
gwiid:id
};


localStorage.setItem("gwiUser",JSON.stringify(user));


document.getElementById("result").innerHTML=
"Your GWI ID: "+id;

}

</script>

</body>
</html>
