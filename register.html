<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create GWI ID | Growth With India</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#050505,#111,#1d1d1d);
padding:20px;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
width:350px;
height:350px;
background:#FFD70033;
border-radius:50%;
top:-100px;
left:-100px;
filter:blur(80px);
}

body::after{
content:"";
position:fixed;
width:350px;
height:350px;
background:#0A84FF22;
border-radius:50%;
bottom:-100px;
right:-100px;
filter:blur(80px);
}

.card{
width:100%;
max-width:430px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:30px;
box-shadow:0 20px 50px rgba(0,0,0,.45);
}

.logo{
width:90px;
height:90px;
margin:auto;
border-radius:20px;
background:#111;
display:flex;
align-items:center;
justify-content:center;
color:#FFD700;
font-size:28px;
font-weight:700;
}

h1{
text-align:center;
color:#fff;
margin-top:18px;
font-size:28px;
}

p{
text-align:center;
color:#bbb;
margin-bottom:25px;
}

.input{
width:100%;
height:55px;
border:none;
outline:none;
padding:0 18px;
margin:10px 0;
border-radius:14px;
background:rgba(255,255,255,.08);
color:#fff;
font-size:15px;
}

.input::placeholder{
color:#ccc;
}

button{
width:100%;
height:56px;
border:none;
border-radius:14px;
background:linear-gradient(90deg,#FFD700,#F4B400);
color:#111;
font-size:18px;
font-weight:700;
cursor:pointer;
margin-top:20px;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">
GWI
</div>

<h1>Create Your GWI ID</h1>

<p>Welcome To Growth With India</p>

<input class="input" placeholder="Sponsor ID">

<input class="input" placeholder="Sponsor Name">

<input class="input" placeholder="Full Name">

<input class="input" placeholder="Mobile Number">

<input class="input" placeholder="Email Address">

<input class="input" placeholder="State">

<input class="input" placeholder="Country">

<button>Create GWI ID</button>

</div>

</body>
</html>
