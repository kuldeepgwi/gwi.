<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - GWI</title>
    <style>
        body { background-color: #000; color: #FFD700; font-family: Arial, sans-serif; text-align: center; padding: 30px; }
        .form-box { border: 2px solid #FFD700; padding: 25px; display: inline-block; border-radius: 15px; width: 320px; background: #111; }
        h1 { margin-bottom: 20px; color: #FFD700; }
        input { display: block; margin: 12px auto; padding: 12px; width: 270px; border-radius: 5px; border: 1px solid #FFD700; background: #222; color: #fff; }
        .btn { background-color: #FFD700; color: #000; padding: 12px; border: none; cursor: pointer; font-weight: bold; width: 295px; border-radius: 5px; margin-top: 10px; font-size: 16px; }
        .btn:hover { background-color: #e6c200; }
        a { color: #FFD700; text-decoration: none; display: block; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="form-box">
        <h1>Register Now</h1>
        <form>
            <input type="text" placeholder="Sponsor ID" required>
            <input type="text" placeholder="Full Name" required>
            <input type="tel" placeholder="Mobile Number" required>
            <input type="email" placeholder="Email ID" required>
            <input type="password" placeholder="Password" required>
            <input type="text" placeholder="State" required>
            <input type="text" placeholder="Country" required>
            <button type="submit" class="btn">Register Now</button>
        </form>
        <a href="index.html">← Back to Home</a>
    </div>
</body>
</html>
