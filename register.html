<!DOCTYPE html>
<html>
<head>

<title>GWI Registration</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="register.css">

</head>

<body>

<div class="box">

<h1>🚀 GWI Registration</h1>
<p>Growth With India Family</p>


<input id="name" type="text" placeholder="Full Name">


<input id="mobile" type="number" placeholder="Mobile Number">


<input id="email" type="email" placeholder="Email ID">


<input id="sponsor" type="text" placeholder="Sponsor ID">



<select id="state">

<option value="">Select State</option>

<option>Andhra Pradesh</option>
<option>Assam</option>
<option>Bihar</option>
<option>Delhi</option>
<option>Gujarat</option>
<option>Haryana</option>
<option>Jharkhand</option>
<option>Karnataka</option>
<option>Kerala</option>
<option>Madhya Pradesh</option>
<option>Maharashtra</option>
<option>Odisha</option>
<option>Punjab</option>
<option>Rajasthan</option>
<option>Tamil Nadu</option>
<option>Telangana</option>
<option>Uttar Pradesh</option>
<option>Uttarakhand</option>
<option>West Bengal</option>
<option>Other</option>

</select>


<input id="city" type="text" placeholder="City">


<div class="password">

<input id="password" type="password" placeholder="Password">

<span onclick="showPassword()">👁️</span>

</div>


<label>

<input id="terms" type="checkbox">

I agree Terms & Conditions

</label>


<button onclick="registerUser()">

Register Now 🚀

</button>


</div>


<script type="module" src="register.js"></script>


</body>
</html>
