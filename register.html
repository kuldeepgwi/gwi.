<!DOCTYPE html>
<html>
<head>

<title>GWI Registration</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
background:#000;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.box{
width:90%;
max-width:380px;
background:#111;
padding:25px;
border-radius:20px;
border:2px solid gold;
}

h1{
color:gold;
text-align:center;
}

input,select{
width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:none;
}

button{
width:100%;
padding:14px;
background:gold;
border:none;
border-radius:20px;
font-weight:bold;
font-size:18px;
}
</style>

</head>

<body>

<div class="box">

<h1>🚀 GWI Registration</h1>

<input id="name" placeholder="Full Name">

<input id="mobile" placeholder="Mobile Number">

<input id="email" placeholder="Email ID">

<input id="sponsor" placeholder="Sponsor ID">

<select id="state">
<option value="">Select State</option>
<option>Rajasthan</option>
<option>Delhi</option>
<option>Gujarat</option>
<option>Other</option>
</select>

<input id="city" placeholder="City">

<input id="gwiid" placeholder="Create GWI ID">

<input id="password" type="password" placeholder="Create Password">


<button onclick="registerUser()">Register Now 🚀</button>

</div>


<script>

function registerUser(){

let user={
name:name.value,
mobile:mobile.value,
email:email.value,
sponsor:sponsor.value,
state:state.value,
city:city.value,
gwiid:gwiid.value,
password:password.value
};


localStorage.setItem("gwiUser",JSON.stringify(user));


alert("Registration Successful");


window.location.href="login.html";

}

</script>


</body>
</html>
